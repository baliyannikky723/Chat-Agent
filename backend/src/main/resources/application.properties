# Orrery backend. Keys and options live in the project's .env file, not here.
spring.application.name=orrery
spring.main.banner-mode=off

# Bound to this computer only; set BACKEND_HOST=0.0.0.0 in .env to expose it (for example in Docker).
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s

# Every request runs on a virtual thread, so a turn that waits on the model costs almost nothing.
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=900000

# Event streams are never compressed (text/event-stream is not in this list): tokens must not wait in a buffer.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=2KB

# SQLite in WAL mode: many readers, one writer at a time, busy_timeout set per connection.
spring.datasource.url=jdbc:sqlite:${orrery.db-path:./data/orrery.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.pool-name=orrery-sqlite
spring.datasource.hikari.maximum-pool-size=4

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

logging.level.root=WARN
logging.level.app.orrery=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %5p %-16.16logger{0} %m%n
